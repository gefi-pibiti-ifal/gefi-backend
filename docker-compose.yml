services:
  postgres:
    image: ankane/pgvector
    container_name: postgres-vector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gefi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

